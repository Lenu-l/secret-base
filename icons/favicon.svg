<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="url(#bg)"/>

  <!-- Stars -->
  <circle cx="120" cy="100" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="380" cy="80" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="100" cy="350" r="1.8" fill="#fff" opacity="0.5"/>
  <circle cx="400" cy="300" r="2" fill="#fff" opacity="0.3"/>
  <circle cx="200" cy="60" r="1.2" fill="#fff" opacity="0.5"/>
  <circle cx="450" cy="180" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="60" cy="220" r="1" fill="#fff" opacity="0.5"/>

  <!-- Main plant/garden icon -->
  <g filter="url(#glow)" transform="translate(256, 256)">
    <!-- Moon crescent -->
    <circle cx="-60" cy="-80" r="30" fill="#FDE68A" opacity="0.9"/>
    <circle cx="-48" cy="-88" r="25" fill="#1a1040"/>

    <!-- Plant stem -->
    <path d="M-10 50 Q-5 20 0 -10" stroke="#A7F3D0" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M0 -10 Q20 -40 10 -70" stroke="#A7F3D0" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M-5 10 Q-30 -10 -25 -40" stroke="#A7F3D0" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Leaves -->
    <ellipse cx="10" cy="-30" rx="14" ry="8" fill="#A7F3D0" opacity="0.8" transform="rotate(-30, 10, -30)"/>
    <ellipse cx="-28" cy="-15" rx="12" ry="7" fill="#86EFAC" opacity="0.7" transform="rotate(20, -28, -15)"/>

    <!-- Purple flower -->
    <circle cx="10" cy="-70" r="10" fill="#A78BFA" opacity="0.9"/>
    <circle cx="10" cy="-70" r="5" fill="#FDE68A" opacity="0.8"/>

    <!-- Small pink flower -->
    <circle cx="-25" cy="-40" r="6" fill="#FBCFE8" opacity="0.8"/>
    <circle cx="-25" cy="-40" r="3" fill="#FDE68A" opacity="0.7"/>

    <!-- Ground -->
    <ellipse cx="0" cy="55" rx="40" ry="12" fill="#A7F3D0" opacity="0.15"/>
  </g>

  <!-- Sparkles -->
  <text x="160" y="160" font-size="20" opacity="0.6">✨</text>
  <text x="310" y="380" font-size="16" opacity="0.4">✨</text>
</svg>
